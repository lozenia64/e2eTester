services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    command: python3 -m uvicorn app.main:app --host 0.0.0.0 --port 2222
    ports:
      - "2222:2222"
    environment:
      E2E_EXECUTION_MODE: remote
      E2E_REDIS_URL: redis://redis:6379/0
      E2E_WORKER_BASE_URL: http://worker:8100
      E2E_DB_PATH: /data/e2etester.db
      E2E_JWT_SECRET: change-me-in-production
    volumes:
      - e2e-data:/data
      - ./artifacts:/app/artifacts
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    command: python3 -m worker.main
    environment:
      E2E_EXECUTION_MODE: remote
      E2E_REDIS_URL: redis://redis:6379/0
      E2E_DB_PATH: /data/e2etester.db
      E2E_WORKER_HTTP_HOST: 0.0.0.0
      E2E_WORKER_HTTP_PORT: "8100"
      E2E_JWT_SECRET: change-me-in-production
    volumes:
      - e2e-data:/data
      - ./artifacts:/app/artifacts
    depends_on:
      redis:
        condition: service_healthy

volumes:
  e2e-data:
