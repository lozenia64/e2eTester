name: ci

# e2eTester PR/push CI
# SSOT: scripts/ci/gates.py — 게이트 목록·경로 글롭은 전부 거기서 온다.
#       이 파일에 게이트를 인라인으로 적지 말 것(2026-08-17 이전 구조에서
#       게이트 4개가 CI 에서 한 번도 실행되지 않는 드리프트가 발생했다).
# 로컬:  python3 scripts/ci/run_all_gates.py --profile full
# 규칙:  docs/CI.md, docs/DOCS_GOVERNANCE.md

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  schedule:
    # Tier 3 보안 게이트 — 주 1회 전체 의존성 감사
    - cron: "0 3 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # merge queue 검증은 취소하지 않는다 — 부분 검증 상태로 큐가 진행되면 위험하다.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  PYTHONUTF8: "1"

jobs:
  plan:
    name: ci / plan
    runs-on: ubuntu-latest
    outputs:
      gates: ${{ steps.plan.outputs.gates }}
      scope: ${{ steps.plan.outputs.scope }}
    steps:
      - uses: actions/checkout@v7
        with:
          # plan.py 가 base ref 와 diff 하려면 전체 히스토리가 필요하다.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Resolve gate list from gates.py
        id: plan
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event_name == 'push' && github.event.before || '') }}
        run: |
          python3 scripts/ci/plan.py \
            --base-ref "$BASE_REF" \
            --event-name "${{ github.event_name }}" \
            --github-output "$GITHUB_OUTPUT"

  gate:
    name: ci / ${{ matrix.gate }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      # 하나가 깨져도 나머지 게이트 결과를 전부 보여준다.
      fail-fast: false
      matrix:
        gate: ${{ fromJSON(needs.plan.outputs.gates) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          # requirements-dev.txt 는 `-r requirements.txt` 를 포함한다.
          # 둘 다 키에 넣지 않으면 런타임 의존성 변경 시 낡은 휠을 재사용한다.
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dev dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: python3 -m pip install -r requirements-dev.txt

      # typecheck_web·eslint_web·build_web·vitest_web 는 Node 자체가 필요하다.
      # coverage 는 pytest 가 base.html 을 거치는 모든 페이지를 렌더링하며
      # asset_css()/asset_js() 가 실제 Vite manifest 를 요구하므로
      # (app/web/asset_manifest.py) 빌드까지 필요하다 — 게이트당 job 이 하나라
      # 다른 job 의 build_web 산출물을 공유받지 못한다.
      - name: Set up Node (프론트 게이트·coverage 용)
        if: matrix.gate == 'typecheck_web' || matrix.gate == 'eslint_web' || matrix.gate == 'build_web' || matrix.gate == 'vitest_web' || matrix.gate == 'coverage'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install web dependencies
        if: matrix.gate == 'typecheck_web' || matrix.gate == 'eslint_web' || matrix.gate == 'build_web' || matrix.gate == 'vitest_web' || matrix.gate == 'coverage'
        run: npm ci

      # coverage 는 빌드 산출물(dist/)까지 있어야 pytest 가 템플릿을 렌더링할 수 있다.
      - name: Build frontend assets (coverage 전용)
        if: matrix.gate == 'coverage'
        run: npm run build

      - name: Run gate — ${{ matrix.gate }}
        run: python3 scripts/ci/run_all_gates.py --gate "${{ matrix.gate }}"

  required:
    name: ci / required
    needs: [plan, gate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify every gate succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::하나 이상의 게이트가 실패했습니다. 위 job 목록을 확인하세요."
            exit 1
          fi
          echo "모든 게이트 통과."
