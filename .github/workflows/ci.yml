name: ci

# e2eTester PR/push CI — SSOT: scripts/ci/gates.py, 로컬: python3 scripts/ci/run_all_gates.py
# 규칙: docs/CI.md, docs/DOCS_GOVERNANCE.md

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  schedule:
    # Tier 3 보안 게이트 — 주 1회 전체 의존성 감사
    - cron: "0 3 * * 1"
      branches:
        - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: ci / changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      security: ${{ steps.filter.outputs.security }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
            security:
              - 'app/auth/**'
              - 'app/api/routes_trigger.py'
              - 'app/api/routes_otp.py'
              - 'app/storage/*input*'
              - 'app/storage/input_crypto.py'
              - 'requirements.txt'
              - 'requirements-dev.txt'

  lint:
    name: ci / lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Ruff
        run: python3 -m pip install "ruff>=0.15,<0.16"

      - name: Lint (ruff check)
        run: ruff check --output-format=github .

      - name: Format check (ruff format --check)
        run: ruff format --check .

  docs:
    name: ci / docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install PyYAML
        run: python3 -m pip install "pyyaml>=6.0,<7.0"

      - name: Run docs ↔ source consistency guard
        run: python3 scripts/check_docs_consistency.py --verbose

      - name: Run architecture gates
        run: python3 scripts/check_architecture_gates.py

  test:
    name: ci / test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies (dev)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: python3 -m pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python3 -m pytest tests/ -q

  security:
    name: ci / security
    needs: changes
    if: >-
      github.event_name == 'schedule' || (
        needs.changes.outputs.code == 'true' &&
        needs.changes.outputs.security == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: python3 -m pip install -r requirements-dev.txt

      - name: Dependency audit (pip-audit)
        env:
          PYTHONUTF8: "1"
        run: python3 -m pip_audit -r requirements.txt

      - name: SAST (bandit — auth/OTP/trigger surfaces)
        run: >-
          python3 -m bandit -c pyproject.toml -r app/auth
          app/api/routes_trigger.py app/api/routes_otp.py
