name: deploy

# main 브랜치 push 시 Oracle Cloud 서버에 rsync 배포 후 systemctl restart.
# 사전 설정: GitHub repo Secrets — SSH_PRIVATE_KEY, SSH_HOST, SSH_USER

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server host key
        run: ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync application to server
        run: |
          rsync -avz --delete \
            --exclude '.git/' \
            --exclude '.venv/' \
            --exclude 'artifacts/' \
            --exclude 'data/' \
            --exclude '.env' \
            --exclude '.oracleCloud/' \
            --exclude '__pycache__/' \
            --exclude '*.db' \
            --exclude '*.db-wal' \
            --exclude '*.db-shm' \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/e2eTester/"

      - name: Install dependencies and restart service
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" 'bash ~/e2eTester/deploy/deploy.sh'
