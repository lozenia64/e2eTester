{% extends "base.html" %}

{% block title %}이상징후 인박스{% endblock %}

{% block content %}
<style>
  /* ── 이상징후 인박스 (scoped: .inbox-*) ───────────────────────────────── */
  .inbox-tone-anomaly { color: var(--st-anomaly); }
  .inbox-tone-error { color: var(--st-error); }

  .inbox-reveal {
    opacity: 0;
    transform: translateY(12px);
    transition: opacity .5s var(--ease-spring), transform .5s var(--ease-spring);
  }
  .inbox-reveal.is-in { opacity: 1; transform: none; }

  .inbox-card { transition: box-shadow .3s var(--ease-spring), border-color .3s var(--ease-spring); }
  .inbox-card:hover { box-shadow: 0 14px 32px -22px rgba(30,41,59,.4); }
  .inbox-card[data-state="RESOLVED"] { opacity: .62; }

  /* 처리상태 세그먼트 토글 */
  .inbox-seg { display: inline-flex; padding: 2px; border-radius: 9px; background: #f3f4f6; }
  .inbox-seg__btn {
    padding: 3px 10px; border-radius: 7px; font-size: 11px; font-weight: 600;
    color: #6b7280; transition: all .2s var(--ease-spring); white-space: nowrap;
  }
  .inbox-seg__btn[aria-pressed="true"] { background: #fff; color: #111827; box-shadow: 0 1px 3px rgba(0,0,0,.12); }

  .inbox-thumb { background: #f8fafc; }
  .inbox-thumb img { object-fit: cover; }

  @media (prefers-reduced-motion: reduce) {
    .inbox-reveal { transition: none; opacity: 1; transform: none; }
    .inbox-card, .inbox-seg__btn { transition: none; }
  }
</style>

<div class="inbox space-y-6">
  <!-- 헤더 -->
  <div class="flex flex-wrap items-end justify-between gap-3">
    <div>
      <p class="text-xs font-semibold uppercase tracking-wider text-indigo-600">Anomaly Inbox</p>
      <h1 class="mt-1 text-2xl font-bold tracking-tight text-gray-900">이상징후 인박스</h1>
      <p class="mt-1.5 text-sm text-gray-500">이상징후·점검실패로 끝난 건을 한 곳에서 <b>확인 → 조치</b>까지 추적합니다.</p>
    </div>
    <button id="inbox-refresh" type="button"
            class="inline-flex items-center gap-1.5 rounded-lg bg-white px-3 py-1.5 text-xs font-semibold text-gray-600 shadow-sm ring-1 ring-gray-200 transition hover:bg-gray-50">
      <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
      새로고침
    </button>
  </div>

  <!-- 요약 KPI -->
  <div class="grid grid-cols-2 gap-3 lg:grid-cols-4">
    <button type="button" data-filter-state="all" class="inbox-kpi rounded-2xl border border-gray-100 bg-white p-4 text-left shadow-sm ring-2 ring-transparent transition data-[active=true]:ring-indigo-400">
      <p class="text-xs font-semibold text-gray-400">전체</p>
      <p class="mt-1 text-2xl font-bold text-gray-900" data-count="total">0</p>
    </button>
    <button type="button" data-filter-state="UNRESOLVED" class="inbox-kpi rounded-2xl border border-gray-100 bg-white p-4 text-left shadow-sm ring-2 ring-transparent transition data-[active=true]:ring-indigo-400">
      <p class="text-xs font-semibold text-gray-400">미확인</p>
      <p class="mt-1 text-2xl font-bold" style="color: var(--st-error)" data-count="unresolved">0</p>
    </button>
    <button type="button" data-filter-state="ACKNOWLEDGED" class="inbox-kpi rounded-2xl border border-gray-100 bg-white p-4 text-left shadow-sm ring-2 ring-transparent transition data-[active=true]:ring-indigo-400">
      <p class="text-xs font-semibold text-gray-400">확인함</p>
      <p class="mt-1 text-2xl font-bold" style="color: var(--st-anomaly)" data-count="acknowledged">0</p>
    </button>
    <button type="button" data-filter-state="RESOLVED" class="inbox-kpi rounded-2xl border border-gray-100 bg-white p-4 text-left shadow-sm ring-2 ring-transparent transition data-[active=true]:ring-indigo-400">
      <p class="text-xs font-semibold text-gray-400">처리완료</p>
      <p class="mt-1 text-2xl font-bold" style="color: var(--st-passed)" data-count="resolved">0</p>
    </button>
  </div>

  <!-- 필터 바 -->
  <div class="flex flex-wrap items-center gap-2">
    <select id="inbox-filter-system" class="rounded-lg border border-gray-200 bg-white px-3 py-1.5 text-xs font-semibold text-gray-600 shadow-sm">
      <option value="all">전체 시스템</option>
    </select>
    <select id="inbox-filter-kind" class="rounded-lg border border-gray-200 bg-white px-3 py-1.5 text-xs font-semibold text-gray-600 shadow-sm">
      <option value="all">전체 유형</option>
      <option value="anomaly">이상징후</option>
      <option value="error">점검실패</option>
    </select>
    <span id="inbox-visible-count" class="ml-auto text-xs text-gray-400"></span>
  </div>

  <!-- 리스트 -->
  <div id="inbox-list" class="space-y-3"></div>

  <div id="inbox-empty" class="hidden rounded-2xl border border-dashed border-gray-200 bg-white/60 p-12 text-center">
    <p class="text-sm font-semibold text-gray-600">표시할 이상건이 없습니다.</p>
    <p class="mt-1 text-xs text-gray-400">필터를 바꾸거나, 모든 이상건이 처리되었는지 확인하세요. 🎉</p>
  </div>
  <div id="inbox-error" class="hidden rounded-2xl border border-red-100 bg-red-50 p-6 text-center">
    <p class="text-sm font-semibold text-red-700">이상건을 불러오지 못했습니다.</p>
    <p class="mt-1 text-xs text-red-400">잠시 후 새로고침해 주세요.</p>
  </div>
  <div id="inbox-loading" class="rounded-2xl border border-gray-100 bg-white p-12 text-center text-sm text-gray-400">불러오는 중…</div>
</div>

<!-- 이상건 카드 템플릿 -->
<template id="inbox-card-template">
  <article class="inbox-reveal inbox-card overflow-hidden rounded-2xl border border-gray-100 bg-white shadow-sm">
    <div class="flex flex-col gap-4 p-4 sm:flex-row">
      <!-- 썸네일 -->
      <a data-field="thumb-link" target="_blank" rel="noreferrer"
         class="inbox-thumb relative block h-28 w-full shrink-0 overflow-hidden rounded-xl ring-1 ring-gray-100 sm:h-24 sm:w-36">
        <img data-field="thumb" alt="종료 화면" class="h-full w-full">
        <span data-field="thumb-empty" class="absolute inset-0 flex items-center justify-center text-[11px] text-gray-300">스크린샷 없음</span>
      </a>
      <!-- 본문 -->
      <div class="min-w-0 flex-1">
        <div class="flex flex-wrap items-center gap-2">
          <span data-field="status-pill" class="rounded-full px-2 py-0.5 text-[11px] font-bold"></span>
          <span data-field="system" class="text-xs font-semibold text-gray-500"></span>
          <span class="text-gray-300">·</span>
          <span data-field="module" class="text-sm font-bold text-gray-900"></span>
          <span data-field="occurred" class="ml-auto text-[11px] text-gray-400"></span>
        </div>
        <p data-field="summary" class="mt-1.5 text-sm text-gray-600"></p>
        <div class="mt-1 flex flex-wrap items-center gap-x-3 gap-y-1 text-[11px] text-gray-400">
          <span data-field="category" class="hidden rounded bg-gray-100 px-1.5 py-0.5 font-medium text-gray-500"></span>
          <a data-field="run-link" class="font-medium text-indigo-600 hover:underline">Run 보기 →</a>
          <span data-field="url" class="truncate"></span>
        </div>
        <!-- 처리 컨트롤 -->
        <div class="mt-3 flex flex-wrap items-center gap-2 border-t border-gray-100 pt-3">
          <div class="inbox-seg" data-field="seg" role="group" aria-label="처리 상태">
            <button type="button" class="inbox-seg__btn" data-seg="UNRESOLVED">미확인</button>
            <button type="button" class="inbox-seg__btn" data-seg="ACKNOWLEDGED">확인함</button>
            <button type="button" class="inbox-seg__btn" data-seg="RESOLVED">처리완료</button>
          </div>
          <select data-field="assignee" class="rounded-lg border border-gray-200 bg-white px-2.5 py-1.5 text-xs font-medium text-gray-600 shadow-sm">
            <option value="">담당자 미배정</option>
          </select>
          <input data-field="memo" type="text" placeholder="메모 추가…" maxlength="200"
                 class="min-w-[8rem] flex-1 rounded-lg border border-gray-200 bg-white px-2.5 py-1.5 text-xs text-gray-700 shadow-sm placeholder:text-gray-300">
          <span data-field="saved" class="hidden text-[11px] font-semibold text-green-600">저장됨</span>
        </div>
      </div>
    </div>
  </article>
</template>
{% endblock %}

{% block scripts %}
<script src="/static/anomalies.js?v=1" defer></script>
{% endblock %}
