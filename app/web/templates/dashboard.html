{% extends "base.html" %}

{% block title %}일간 점검 대시보드{% endblock %}

{% block content %}
<div class="dash"
     x-data="{ drawerOpen: false }"
     @dash-close-drawer.window="drawerOpen = false"
     @dash-open-drawer.window="drawerOpen = true">

  <div id="dash-host-kpi"
       hx-get="/api/dashboard/daily/fragments/kpi"
       hx-trigger="load, dash-refresh from:body"
       hx-indicator="#dash-htmx-busy"
       hx-swap="innerHTML">
    <div class="dash-hero" aria-hidden="true">
      <div class="dash-hero__top">
        <div class="dash-hero__text">
          <h1 class="dash-hero__title">오늘의 점검 현황</h1>
          <p class="dash-hero__meta">&nbsp;</p>
        </div>
        <div class="dash-hero__aside"></div>
      </div>
    </div>
  </div>

  <div id="dash-host-matrix"
       class="dash-host-matrix"
       hx-get="/api/dashboard/daily/fragments/matrix"
       hx-trigger="load, dash-refresh from:body"
       hx-indicator="#dash-htmx-busy"
       hx-swap="innerHTML">
    <div class="dash__systems" aria-hidden="true">
      <div class="dash-sys-row" style="opacity:0.4"></div>
    </div>
  </div>

  <div id="dash-error" class="hidden">
    <p>점검 현황을 불러오지 못했습니다.</p>
  </div>

  <div class="dash-drawer" x-show="drawerOpen" x-cloak @click.self="drawerOpen = false">
    <div class="dash-drawer__panel" id="dash-drawer-body" @click.stop></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
{% import "_assets.html" as dash_assets %}
{{ dash_assets.asset_script("entries/dashboard.ts") }}
{% endblock %}
