{% extends "admin/base.html" %}
{% block title %}모듈 설정{% endblock %}
{% block nav_modules %}bg-red-50 text-red-700 font-semibold{% endblock %}

{% block content %}
<div>
    <p class="text-xs font-semibold uppercase tracking-wider text-red-600">Admin</p>
    <h1 class="mt-1 text-2xl font-bold tracking-tight text-gray-900">모듈 설정</h1>
    <p class="mt-1.5 text-sm text-gray-500">시스템·모듈별 수동 업무 예상 시간(초)을 관리합니다. 저장된 값이 통계 절감 시간 계산에 사용됩니다.</p>
</div>

<div id="systems-container" class="space-y-6">
    <p class="text-sm text-gray-400">불러오는 중...</p>
</div>
{% endblock %}

{% block scripts %}
<script>
const OVERRIDE_CLASSES = ['border-indigo-300', 'bg-indigo-50', 'text-indigo-700', 'font-semibold'];
const DEFAULT_BORDER = 'border-gray-300';

function showSystemMessage(systemCode, text, colorClass) {
    const msgEl = document.getElementById('msg-sys-' + systemCode);
    if (!msgEl) return;
    msgEl.textContent = text;
    msgEl.className = 'text-sm min-h-[1.25rem] ' + colorClass;
}

function clearSystemMessageLater(systemCode, delayMs) {
    setTimeout(() => {
        const msgEl = document.getElementById('msg-sys-' + systemCode);
        if (!msgEl) return;
        msgEl.textContent = '';
        msgEl.className = 'text-sm min-h-[1.25rem]';
    }, delayMs);
}

function applyOverrideStyle(input) {
    input.classList.remove(DEFAULT_BORDER);
    OVERRIDE_CLASSES.forEach(c => input.classList.add(c));
}

async function loadSettings() {
    const res = await fetch('/api/admin/module-settings');
    if (!res.ok) { document.getElementById('systems-container').innerHTML = '<p class="text-sm text-red-500">불러오기 실패</p>'; return; }
    const systems = await res.json();

    const container = document.getElementById('systems-container');
    if (systems.length === 0) {
        container.innerHTML = '<p class="text-sm text-gray-500">등록된 시스템이 없습니다.</p>';
        return;
    }

    container.innerHTML = systems.map(sys => `
        <div class="rounded-xl border border-gray-200 bg-white shadow-sm overflow-hidden" data-system-code="${sys.system_code}">
            <div class="border-b border-gray-100 px-6 py-4">
                <h2 class="text-sm font-semibold text-gray-900">${sys.system_name} <span class="text-xs text-gray-400 font-normal">(${sys.system_code})</span></h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider text-gray-500">모듈</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider text-gray-500">모듈 ID</th>
                            <th class="px-4 py-3 text-right text-xs font-semibold uppercase tracking-wider text-gray-500">수동 업무 시간(초)</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100">
                        ${sys.modules.map(m => `
                        <tr class="hover:bg-gray-50" id="row-${m.module_id.replace('.', '-')}">
                            <td class="px-4 py-3 font-medium">${m.name}</td>
                            <td class="px-4 py-3 text-xs text-gray-400 font-mono">${m.module_id}</td>
                            <td class="px-4 py-3 text-right">
                                <div class="flex items-center justify-end gap-1">
                                    <input type="number" min="0" max="99999"
                                        value="${m.estimated_manual_seconds}"
                                        data-module-id="${m.module_id}"
                                        data-original="${m.estimated_manual_seconds}"
                                        class="w-24 rounded-lg border px-2 py-1 text-sm text-right focus:outline-none focus:ring-2 focus:ring-indigo-500 ${m.is_overridden ? 'border-indigo-300 bg-indigo-50 text-indigo-700 font-semibold' : 'border-gray-300'}"
                                        title="${m.is_overridden ? 'DB 오버라이드 값 (manifest 기본값: ' + m.manifest_default + '초)' : 'manifest 기본값'}">
                                    <span class="text-xs text-gray-400">초</span>
                                </div>
                            </td>
                        </tr>`).join('')}
                    </tbody>
                    <tfoot class="border-t-2 border-gray-200 bg-gray-50">
                        ${(() => {
                            const total = sys.modules.reduce((s, m) => s + m.estimated_manual_seconds, 0);
                            const mins = Math.floor(total / 60), secs = total % 60;
                            return `<tr>
                                <td colspan="2" class="px-4 py-2 text-xs font-semibold text-gray-500 text-right">합계</td>
                                <td class="px-4 py-2 text-right text-xs font-bold text-gray-700">${total}초 (총 ${mins}분 ${secs}초)</td>
                            </tr>`;
                        })()}
                    </tfoot>
                </table>
            </div>
            <div class="flex flex-wrap justify-end items-center gap-3 border-t border-gray-100 bg-white px-6 py-3">
                <span id="msg-sys-${sys.system_code}" role="status" aria-live="polite" class="text-sm min-h-[1.25rem]"></span>
                <button type="button"
                    data-action="save-system"
                    data-system-code="${sys.system_code}"
                    class="min-w-[4.5rem] rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed">
                    저장
                </button>
            </div>
        </div>
    `).join('');

    container.querySelectorAll('[data-action="save-system"]').forEach(btn => {
        btn.addEventListener('click', () => saveSystem(btn.dataset.systemCode));
    });
}

async function saveSystem(systemCode) {
    const card = document.querySelector(`[data-system-code="${systemCode}"]`);
    if (!card) return;

    const btn = card.querySelector('[data-action="save-system"]');
    const inputs = card.querySelectorAll('input[data-module-id]');

    showSystemMessage(systemCode, '', '');

    for (const input of inputs) {
        const seconds = parseInt(input.value, 10);
        if (isNaN(seconds) || seconds < 0) {
            showSystemMessage(systemCode, '올바른 숫자를 입력하세요.', 'text-red-600');
            input.focus();
            return;
        }
    }

    const modules = [];
    for (const input of inputs) {
        if (String(input.value) !== String(input.dataset.original)) {
            modules.push({
                module_id: input.dataset.moduleId,
                estimated_manual_seconds: parseInt(input.value, 10),
            });
        }
    }

    if (modules.length === 0) {
        showSystemMessage(systemCode, '변경된 항목이 없습니다.', 'text-gray-500');
        clearSystemMessageLater(systemCode, 2500);
        return;
    }

    btn.disabled = true;
    btn.setAttribute('aria-busy', 'true');

    let data;
    try {
        const res = await fetch(`/api/admin/module-settings/systems/${systemCode}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({modules}),
        });
        data = await res.json().catch(() => ({}));

        if (!res.ok) {
            const detail = data.detail;
            const msg = typeof detail === 'string' ? detail
                : Array.isArray(detail) ? detail.map(d => d.msg || d).join(', ')
                : '저장 실패';
            showSystemMessage(systemCode, msg, 'text-red-600');
            return;
        }

        if (data.ok === false) {
            const failedIds = (data.failed || []).map(f => f.module_id).join(', ');
            const msg = failedIds
                ? `일부 모듈만 저장되었습니다. (${failedIds})`
                : '일부 모듈만 저장되었습니다.';
            showSystemMessage(systemCode, msg, 'text-amber-600');
            (data.saved || []).forEach(item => {
                const input = card.querySelector(`input[data-module-id="${item.module_id}"]`);
                if (input) {
                    applyOverrideStyle(input);
                    input.dataset.original = String(item.estimated_manual_seconds);
                }
            });
            return;
        }

        showSystemMessage(systemCode, '저장됨', 'text-green-600');
        (data.saved || modules).forEach(item => {
            const input = card.querySelector(`input[data-module-id="${item.module_id}"]`);
            if (input) {
                applyOverrideStyle(input);
                input.dataset.original = String(item.estimated_manual_seconds);
            }
        });
        clearSystemMessageLater(systemCode, 2500);
    } catch {
        showSystemMessage(systemCode, '저장 실패', 'text-red-600');
    } finally {
        btn.disabled = false;
        btn.removeAttribute('aria-busy');
    }
}

loadSettings();
</script>
{% endblock %}
