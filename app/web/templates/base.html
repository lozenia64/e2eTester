<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}E2E Tester{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/app.css">
</head>
<body>
    <div class="page-shell">
        <header class="topbar">
            <a href="/" class="brand">E2E Control Deck</a>
            <div class="topbar-copy">Python + FastAPI + Playwright MCP</div>
        </header>
        <main>
            {% block content %}{% endblock %}
        </main>
    </div>
    <script src="/static/app.js?v=3" defer></script>
    {% block scripts %}{% endblock %}
</body>
</html>
