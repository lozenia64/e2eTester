system_code: hom
name: 대표홈페이지(PC)
description: 접속 · 로그인 · 계약 조회 · 보험금청구 · 증명서 발급 점검
display_order: 10
supported_auth_methods:
- phone
- kakao
run_form:
- key: browser_mode
  label: 브라우저 실행 모드
  type: select
  required: true
  default: headed
  help_text: headed를 선택하면 웹에서 실행할 때 로컬 PC에 실제 브라우저 창이 추가로 열립니다.
  options:
  - label: 실제 브라우저 창 열기
    value: headed
  - label: 백그라운드 실행
    value: headless
- key: auth_method
  label: 인증 수단
  type: select
  required: true
  default: phone
  help_text: 휴대폰인증과 카카오인증을 실행할 수 있습니다. 금융인증서·공동인증서는 준비 중입니다.
  options:
  - label: 휴대폰인증
    value: phone
  - label: 카카오인증
    value: kakao
  - label: 금융인증서인증
    value: finance_certificate
  - label: 공동인증서인증
    value: public_certificate
- key: name
  label: 고객명
  type: text
  required: true
  placeholder: 홍길동
  show_when:
    auth_method:
    - phone
    - kakao
- key: birthdate
  label: 생년월일
  type: text
  required: true
  placeholder: YYYYMMDD
  show_when:
    auth_method:
    - phone
    - kakao
- key: gender
  label: 성별
  type: select
  required: true
  default: male
  show_when:
    auth_method: phone
  options:
  - label: 남성
    value: male
  - label: 여성
    value: female
- key: residency
  label: 내외국인 구분
  type: select
  required: true
  default: domestic
  show_when:
    auth_method: phone
  options:
  - label: 내국인
    value: domestic
  - label: 외국인
    value: foreign
- key: carrier
  label: 통신사
  type: select
  required: true
  default: skt
  show_when:
    auth_method: phone
  options:
  - label: SKT
    value: skt
  - label: KT
    value: kt
  - label: LGU+
    value: lgu+
  - label: SKT 알뜰폰
    value: skt_mvno
  - label: KT 알뜰폰
    value: kt_mvno
  - label: LGU+ 알뜰폰
    value: lgu_mvno
- key: phone_number
  label: 휴대폰 번호
  type: text
  required: true
  placeholder: 01012345678
  show_when:
    auth_method:
    - phone
    - kakao
modules:
- module_id: hom.main.access
  system_code: hom
  name: 메인화면 접속
  description: 메인화면에 접속하고 초기 팝업을 정리합니다.
  group: access
  order: 10
  depends_on: []
  timeout_seconds: 180
  execution_mode: hom_workflow_step
  workflow_name: hom_login
  workflow_step: main_access
  estimated_manual_seconds: 60
  max_retries: 1
  retry_backoff_ms: 300
  retryable_on:
  - ERROR
  partial_rerun_allowed: true
- module_id: hom.login
  system_code: hom
  name: 로그인
  description: 메인화면 우측 상단 로그인 버튼을 클릭해 로그인 화면으로 이동한 뒤 선택한 인증수단(휴대폰 OTP 또는 카카오 30초 대기)으로 로그인을 완료합니다.
  group: login
  order: 20
  depends_on:
  - hom.main.access
  timeout_seconds: 300
  execution_mode: hom_workflow_step
  workflow_name: hom_login
  workflow_step: login
  requires_user_input: true
  estimated_manual_seconds: 300
  max_retries: 1
  retry_backoff_ms: 500
  retryable_on:
  - ERROR
  partial_rerun_allowed: false
- module_id: hom.contract.list
  system_code: hom
  name: 계약목록 조회
  description: MY한화 GNB 메뉴의 개인계약 조회를 클릭해 계약목록 조회 화면으로 이동하고 목록 건수를 확인합니다.
  group: inquiry
  order: 40
  depends_on:
  - hom.login
  timeout_seconds: 180
  execution_mode: hom_workflow_step
  workflow_name: hom_login
  workflow_step: contract_list
  estimated_manual_seconds: 180
  max_retries: 2
  retry_backoff_ms: 500
  retryable_on:
  - ERROR
  partial_rerun_allowed: true
- module_id: hom.contract.detail
  system_code: hom
  name: 계약상세 조회
  description: 계약목록 화면에서 첫 번째 선택 가능한 계약으로 이동하고 계약상세 주요 정보영역을 확인합니다.
  group: inquiry
  order: 50
  depends_on:
  - hom.contract.list
  timeout_seconds: 180
  execution_mode: hom_workflow_step
  workflow_name: hom_login
  workflow_step: contract_detail
  estimated_manual_seconds: 180
  max_retries: 2
  retry_backoff_ms: 500
  retryable_on:
  - ERROR
  partial_rerun_allowed: true
- module_id: hom.compensation.charge
  system_code: hom
  name: 보험금청구 접수(질병/상해)
  description: 보상 GNB 진입부터 신규접수·정보입력·서류등록을 거쳐 보험금청구 완료(charge06)까지 진행되는지 확인합니다.
  group: inquiry
  order: 60
  depends_on:
  - hom.login
  timeout_seconds: 300
  execution_mode: hom_workflow_step
  workflow_name: hom_login
  workflow_step: compensation_charge
  estimated_manual_seconds: 600
  max_retries: 2
  retry_backoff_ms: 500
  retryable_on:
  - ERROR
  partial_rerun_allowed: true
- module_id: hom.compensation.result
  system_code: hom
  name: 보험금청구 결과 조회
  description: 보험금청구 결과조회에서 오늘 접수한 테스트 청구를 찾아 상세·제출서류를 확인합니다.
  group: inquiry
  order: 70
  depends_on:
  - hom.compensation.charge
  timeout_seconds: 300
  execution_mode: hom_workflow_step
  workflow_name: hom_login
  workflow_step: compensation_result
  estimated_manual_seconds: 180
  max_retries: 2
  retry_backoff_ms: 500
  retryable_on:
  - ERROR
  partial_rerun_allowed: true
- module_id: hom.compensation.cancel
  system_code: hom
  name: 보험금청구 취소
  description: 진행중 보험금청구를 접수취소하고 진행중 탭에서 제거되며 완료 탭에 취소 상태로 반영되는지 확인합니다.
  group: inquiry
  order: 80
  depends_on:
  - hom.compensation.charge
  timeout_seconds: 300
  execution_mode: hom_workflow_step
  workflow_name: hom_login
  workflow_step: compensation_cancel
  estimated_manual_seconds: 300
  max_retries: 2
  retry_backoff_ms: 500
  retryable_on:
  - ERROR
  partial_rerun_allowed: true
- module_id: hom.proof.long_term_policy
  system_code: hom
  name: 장기보험증권 증명서 발급
  description: 증명서 발급 메뉴에서 장기보험증권을 선택하고 첫 계약을 다운로드 방식으로 발급해 PDF 다운로드를 확인합니다.
  group: proof
  order: 90
  depends_on:
  - hom.login
  timeout_seconds: 180
  execution_mode: hom_workflow_step
  workflow_name: hom_login
  workflow_step: long_term_policy_certificate
  estimated_manual_seconds: 300
  max_retries: 2
  retry_backoff_ms: 500
  retryable_on:
  - ERROR
  partial_rerun_allowed: true
execution_profile: heavy
