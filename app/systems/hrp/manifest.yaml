system_code: hrp
name: 현장출동 홈페이지(PC)
description: 현장출동(이글PRM) 홈페이지 메인화면 접속 점검
display_order: 30
supported_auth_methods: []
run_form:
  - key: browser_mode
    label: 브라우저 실행 모드
    type: select
    required: true
    default: headed
    help_text: headed를 선택하면 웹에서 실행할 때 로컬 PC에 실제 브라우저 창이 추가로 열립니다.
    options:
      - label: 실제 브라우저 창 열기
        value: headed
      - label: 백그라운드 실행
        value: headless
modules:
  - module_id: hrp.main.access
    system_code: hrp
    name: 메인화면 접속
    description: 현장출동 홈페이지(PC) 메인화면에 접속하고 초기 팝업을 정리합니다.
    group: access
    order: 10
    depends_on: []
    timeout_seconds: 120
    execution_mode: hrp_workflow_step
    workflow_name: hrp_access
    workflow_step: main_access
    estimated_manual_minutes: 2
